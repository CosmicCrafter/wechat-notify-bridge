name: Tests and package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
            mcp-plugin/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install -e ./server -r server/requirements-dev.txt -r mcp-plugin/requirements.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Frontend install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test
          npm run format:check
      - name: Python formatting
        run: ruff format --check server/src scripts mcp-plugin/server mcp-plugin/tools server/scripts examples
      - name: Regression tests
        run: python -m pytest -q
      - name: Project checks
        run: python scripts/check_project.py
      - name: Wheel package
        run: python scripts/build_wheel.py
      - name: Source package
        run: python scripts/build_release.py
      - name: Verify extracted source package
        run: python scripts/verify_release.py dist/notify-bridge-source.zip
      - name: Local plugin package
        run: python mcp-plugin/tools/build_local_plugin.py --output dist/wechat-notify-local.zip
      - name: Remote plugin package example
        run: python mcp-plugin/tools/build_remote_plugin.py --base-url https://notify.example.com/bridge --output dist/wechat-notify-remote-example.zip

