name: Tests and package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
            mcp-plugin/requirements.txt
      - name: Install
        run: python -m pip install -e ./server -r server/requirements-dev.txt -r mcp-plugin/requirements.txt
      - name: Regression tests
        run: python -m pytest -q
      - name: Project checks
        run: python scripts/check_project.py
      - name: Source package
        run: python scripts/build_release.py
      - name: Local plugin package
        run: python mcp-plugin/tools/build_local_plugin.py --output dist/wechat-notify-local.zip
      - name: Remote plugin package example
        run: python mcp-plugin/tools/build_remote_plugin.py --base-url https://notify.example.com/wechat --output dist/wechat-notify-remote-example.zip
