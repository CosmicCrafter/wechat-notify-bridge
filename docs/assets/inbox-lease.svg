<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 375" role="img" aria-labelledby="title desc"><title id="title">protected 租约接管与代际屏障</title><desc id="desc">旧接收器领取第一代后离线，租约到期后新接收器用新请求接管第二代，旧结果不能覆盖。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#386be8"/></marker></defs><rect width="720" height="375" rx="12" fill="#f7f9fc"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#172b44"><text x="25" y="30">接收器 A（旧）</text><text x="300" y="30">中转站持久记录</text><text x="575" y="30">接收器 B（新）</text><path d="M85 45V345 M355 45V345 M645 45V345" stroke="#c9d5e5"/><path d="M85 75H355 M355 115H85 M645 190H355 M355 230H645 M85 280H355 M645 325H355" stroke="#386be8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="155" y="65">claim：attempt A</text><text x="150" y="105">generation = 1</text><text x="30" y="155" fill="#bf4353">离线 / 未续租</text><text x="370" y="155" fill="#63758d">租约过期，非终态</text><text x="420" y="180">新 attempt B 接管</text><text x="430" y="220">generation = 2</text><text x="120" y="270" fill="#bf4353">迟到 g=1 报告：拒绝</text><text x="425" y="315">当前 g=2 报告完成</text><text x="25" y="365" font-size="12" fill="#63758d">只保护中转站状态写入；外部副作用仍须业务幂等。legacy 没有此租约接管保证。</text></g></svg>
