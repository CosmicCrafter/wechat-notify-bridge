<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="title desc"><title id="title">首次接入的分层验收</title><desc id="desc">管理员交接私有配置，调用方先查询身份和dry_run；获授权后发送，再核对平台与定向回复。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#386be8"/></marker></defs><rect width="720" height="290" rx="12" fill="#f7f9fc"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#172b44"><text x="35" y="35">管理员</text><text x="220" y="35">调用方</text><text x="400" y="35">Notify Bridge</text><text x="615" y="35">通信平台</text><path d="M80 50V265 M265 50V265 M455 50V265 M655 50V265" stroke="#c9d5e5"/><path d="M80 85H265 M265 130H455 M265 185H455 M455 185H655 M655 240H455 M455 240H265" stroke="#386be8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="105" y="75">私有配置交接</text><text x="295" y="120">身份 / dry_run</text><text x="295" y="175">获授权才发送</text><text x="505" y="175">平台请求</text><text x="495" y="230">本人原平台回复</text><text x="300" y="230">准确归属与收件</text><text x="25" y="280" font-size="12" fill="#63758d">每一层独立验收：参数校验与平台接受，不等于真人收件或业务完成。</text></g></svg>
