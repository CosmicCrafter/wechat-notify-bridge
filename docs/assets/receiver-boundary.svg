<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">protected 会话的双重校验</title><desc id="desc">应用认证之后还检查对应会话能力。A的能力不能用于B；能力持有不是宿主强身份。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#386be8"/></marker></defs><rect width="720" height="280" rx="12" fill="#f7f9fc"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#172b44"><rect x="20" y="95" width="155" height="75" rx="12" fill="#ecf2ff" stroke="#a6bdf3"/><text x="44" y="124">一个应用 Key</text><text x="43" y="148">多个稳定会话</text><rect x="240" y="95" width="190" height="75" rx="12" fill="#ecf2ff" stroke="#a6bdf3"/><text x="262" y="124">应用 + 会话能力校验</text><text x="274" y="148">Bot / 状态 / 角色</text><rect x="515" y="30" width="180" height="75" rx="12" fill="#fff" stroke="#9bb1ce"/><text x="540" y="60">protected 会话 A</text><text x="550" y="84">只读 / 主接收者</text><rect x="515" y="180" width="180" height="75" rx="12" fill="#fff" stroke="#9bb1ce"/><text x="540" y="210">protected 会话 B</text><text x="550" y="234">独立能力与记录</text><path d="M175 132H240 M430 115L515 68 M430 150L515 218" stroke="#386be8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="449" y="75">A 能力</text><text x="449" y="207">B 能力</text><path d="M605 106V177" stroke="#bf4353" stroke-dasharray="5 4" stroke-width="2"/><text x="617" y="146" fill="#bf4353">拒绝跨读</text><text x="22" y="270" font-size="12" fill="#63758d">校验能力持有与范围；不证明宿主窗口身份，也不隔离可读取同一私有文件的进程。</text></g></svg>
