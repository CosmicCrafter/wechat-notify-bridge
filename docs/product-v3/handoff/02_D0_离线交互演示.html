function renderLogin(){return `<div class="login-shell"><section class="login-aside"><div><div class="row"><div class="brand-mark">${ico('layers',20)}</div><b style="font-size:17px">Notify Bridge</b></div><h1>所有消息，<br>在一个地方清楚连接。</h1><div class="login-copy">接入应用、通信连接、消息投递与双向会话。<br>安全、可追溯，也可以直接从手机互动。</div></div><div class="login-aside-illustration"><div class="login-line"><span>Codex / 服务器 / 业务程序</span>${ico('checkCircle',16)}</div><div class="login-line"><span>统一中转与投递记录</span>${ico('checkCircle',16)}</div><div class="login-line"><span>微信 / 飞书 / 手机端</span>${ico('checkCircle',16)}</div></div><div class="small" style="color:#7e90a9">D0 UI 产品原型 · 不连接正式服务</div></section><section class="login-form-wrap"><form class="login-form" data-form="login"><div class="login-logo">${ico('lock',23)}</div><div><h2>登录管理端</h2><p class="muted small mt8">使用示例账号体验新认证流程，真实后端尚未实施。</p></div><div class="notice warning">${state.adminPassword==='DemoOnly123!'?`演示账号：<b>${esc(state.adminName)}</b>，初始密码 <code>DemoOnly123!</code>。`:'你在本次原型会话中已修改演示密码，请使用新密码。'} 不是生产凭据。</div><div class="field"><label>管理员用户名</label><input class="control" name="username" autocomplete="username" value="${esc(state.adminName)}" required></div><div class="field"><label>密码</label><input class="control" name="password" type="password" autocomplete="current-password" required placeholder="请输入密码"></div>${state.loginError?`<div class="notice danger">${esc(state.loginError)}</div>`:''}<button class="btn btn-primary btn-block" type="submit">登录管理端</button><button type="button" class="link center small" data-action="forgot-password">忘记管理密码？</button></form></section></div>${state.modal?renderModal():''}${state.notice?`<div class="toast-stack"><div class="toast">${esc(state.notice.msg)}<button class="btn btn-ghost btn-sm" data-action="dismiss-toast">关闭</button></div></div>`:''}`}
function modalFrame(title,body,footer='',subtitle='',wide=false){return `<div class="overlay" data-action="overlay-close" role="presentation"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}" data-modal-content="true"><div class="modal-head"><div><h2>${esc(title)}</h2>${subtitle?`<p class="caption mt8">${esc(subtitle)}</p>`:''}</div><button class="btn btn-ghost icon-btn" data-action="close-modal" aria-label="关闭弹窗">${ico('close',18)}</button></div>${body}${footer?`<div class="modal-foot">${footer}</div>`:''}</div></div>`}
function formBody(fields){return `<div class="modal-body">${fields}</div>`}
function footerSubmit(label='完成',danger=false){return `<button class="btn btn-secondary" data-action="close-modal">取消</button><button form="active-form" type="submit" class="btn ${danger?'btn-danger':'btn-primary'}">${label}</button>`}
function renderModal(){const m=state.modal; if(!m)return '';
  if(m.type==='newConversation')return modalFrame('新建会话',`<form class="modal-body" id="active-form" data-form="create-conversation">
   ${note('先选择有收件能力的接入应用。发送首条消息后才创建会话，取消不会留下空会话。')}
   <div class="field"><label>接收应用</label><select class="control" name="appId" required><option value="">请选择接收对象</option>${apps.map(a=>`<option value="${a.id}" ${(!a.active||!a.receive)?'disabled':''}>${esc(a.name)} ${a.active&&a.receive?'· 可保存到收件箱':'· 不具备收件条件'}</option>`).join('')}</select><div class="hint">已登记的 Codex 不等于当前在线；成功创建后通常显示“待领取”。</div></div>
   <div class="field"><label>会话名称 <span class="muted tiny">选填</span></label><input class="control" name="title" placeholder="例如：升级计划讨论"></div>
   <div class="field"><label>首条消息</label><textarea class="control textarea" name="content" required placeholder="你想让该接入应用知道什么？"></textarea></div>
   </form>`,footerSubmit('创建并发送'), '使用统一收件箱建立可追溯会话。');
  if(m.type==='newApp')return modalFrame('新增接入应用',`<form id="active-form" class="modal-body" data-form="create-app"><div class="field"><label>应用名称</label><input class="control" required name="name" placeholder="例如：监控服务器"></div><div class="field"><label>允许使用的通信连接</label><div class="grid" style="gap:9px">${connections.filter(c=>c.active).map(c=>`<label class="row" style="font-size:13px"><input type="checkbox" name="allowed" value="${c.id}" ${c.id==='conn-feishu'?'checked':''}> ${esc(c.name)}</label>`).join('')}</div></div><div class="field"><label>默认连接</label><select class="control" name="defaultConnection">${connections.filter(c=>c.active).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><div class="hint">默认连接必须属于允许范围；创建后也可调整。</div></div><label class="row" style="font-size:13px"><input type="checkbox" name="receive" checked> 为应用启用会话收件能力</label>${note('将生成标识为 nb_demo_ 的本地演示 Key（不能用于真实中转站）。签发时提供一次完整复制。')}</form>`,footerSubmit('创建应用并签发模拟 Key'));
  if(m.type==='keyIssued')return modalFrame('模拟 Key 已签发',`<div class="modal-body"><div class="row gap6">${ico('checkCircle',18)} ${pill('仅本地示例','info')}</div><p class="small muted">已为 <b>${esc(appBy(m.appId)?.name||'新应用')}</b> 生成演示凭据。这里只展示一次；关闭后仅保留公开 Key ID 和掩码。</p><div class="field"><label>演示凭据（不具备任何认证能力）</label><div class="row"><input class="control mono" readonly id="issued-token" value="${esc(m.token)}"><button class="btn btn-secondary" data-action="copy-issued">${ico('copy',15)} 复制</button></div></div>${note('真正的 Key 应由服务端用安全随机源生成，并仅保存安全校验材料。本原型没有真实 Key。','warning')}</div>`,`<button class="btn btn-primary" data-action="close-modal">已保存，关闭</button>`);
  if(m.type==='rotateKey')return modalFrame('更换应用 Key',`<form class="modal-body" id="active-form" data-form="rotate-key"><div><b class="small">${esc(appBy(m.appId)?.name||'')}</b><p class="caption mt8">普通更换时建议给使用方短暂迁移窗口；应用 ID、历史会话保持不变。</p></div>${note('正式后端 1.16.0 仍是单 Key 哈希并即时轮换；新旧并存是待实施的能力，当前仅模拟交互。','warning')}<div class="field"><label>切换方式</label><label class="row small"><input type="radio" name="mode" value="normal" checked> 正常轮换（先签新 Key，旧 Key 进入过渡）</label><label class="row small"><input type="radio" name="mode" value="emergency"> 泄露应急（立刻撤销现有 Key）</label></div></form>`,footerSubmit('确认更换'));
  if(m.type==='revokeKey')return modalFrame('立即撤销凭据',`<form id="active-form" data-form="revoke-key" class="modal-body">${note('这是安全应急操作。该应用使用当前 Key 的外部程序会立即失去认证能力。既有消息和会话仍应保留。','danger')}<p class="small">影响应用：<b>${esc(appBy(m.appId)?.name||'')}</b></p><div class="field"><label>输入“撤销”以确认</label><input class="control" required name="confirm" placeholder="撤销"></div></form>`,footerSubmit('立即撤销',true));
  if(m.type==='newConnection')return modalFrame('新增通信连接',`<form id="active-form" data-form="create-connection" class="modal-body"><div class="steps"><span class="step-pill active">1 创建连接</span><span class="step-pill">2 配置凭据</span><span class="step-pill">3 验证收发</span></div><div class="field"><label>通信平台</label><select class="control" name="platform"><option value="feishu">飞书</option><option value="wechat">微信</option></select></div><div class="field"><label>连接名称</label><input class="control" required name="name" placeholder="例如：飞书 · 紧急告警"></div>${note('此处只创建一个待配置连接；不能把保存配置误称为测试成功。')}
 </form>`,footerSubmit('创建待配置连接'));
  if(m.type==='editApp') {const a=appBy(m.appId);return modalFrame('应用授权与默认路由',`<form id="active-form" data-form="edit-app" class="modal-body"><p class="small semi">${esc(a?.name||'')}</p><div class="field"><label>允许的通信连接</label>${connections.filter(c=>c.active).map(c=>`<label class="row small"><input type="checkbox" name="allowed" value="${c.id}" ${a.allowed.includes(c.id)?'checked':''}> ${esc(c.name)}</label>`).join('')}</div><div class="field"><label>默认连接</label><select class="control" name="defaultConn">${connections.filter(c=>c.active).map(c=>`<option value="${c.id}" ${a.defaultConn===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><label class="row small"><input type="checkbox" name="receive" ${a.receive?'checked':''}> 启用应用收件箱与会话能力</label>${note('修改授权影响后续请求，但不改写历史消息的原连接或已有会话。','warning')}</form>`,footerSubmit('保存授权'));}
  if(m.type==='integrate') {const a=appBy(m.appId),kind=m.choice||'codex';return modalFrame('获取接入资料',`<div class="modal-body"><p class="caption">接入应用：<b>${esc(a?.name||'')}</b>。选择本次面向的接入方，应用身份不随导出类型变化。</p><div class="segment"><button class="${kind==='codex'?'active':''}" data-action="integration-kind" data-kind="codex">Codex</button><button class="${kind==='claude'?'active':''}" data-action="integration-kind" data-kind="claude">Claude Code</button><button class="${kind==='http'?'active':''}" data-action="integration-kind" data-kind="http">HTTP 系统</button></div>
 <div class="surface" style="padding:16px"><div class="section-title">${kind==='http'?'业务系统 API 接入':kind==='claude'?'Claude Code 客户端':'Codex 客户端'}</div><div class="help-step"><span class="help-step-num">1</span><div><b class="small">核验应用身份</b><p class="caption">${esc(a?.name)} · ${esc(a?.id)}</p></div></div><div class="help-step"><span class="help-step-num">2</span><div><b class="small">按客户端安装接入</b><p class="caption">${kind==='http'?'获取 HTTP API 合同、幂等和回执查询示例。':'按宿主要求配置 MCP，并加载所需使用说明。'}</p></div></div><div class="help-step"><span class="help-step-num">3</span><div><b class="small">完成验证</b><p class="caption">先验证发送，再按接入能力验证收件与回复；不能以安装成功代替已唤醒。</p></div></div></div>
 ${note('此处只能下载不含密钥的演示说明；私密配置需要由真实受控管理服务单独签发。','warning')}</div>`,`<button class="btn btn-secondary" data-action="close-modal">关闭</button><button class="btn btn-primary" data-action="download-doc" data-id="${esc(m.appId)}" data-kind="${kind}">${ico('download',15)} 下载模拟说明</button>`, '',true)}
  if(m.type==='applyProxy')return modalFrame('确认切换出口',`<div class="modal-body"><div class="info-pair"><span class="term">当前生效</span><b>${esc(nodes.find(n=>n.id===state.proxyApplied)?.name||'')}</b></div><div class="info-pair"><span class="term">拟应用</span><b>${esc(nodes.find(n=>n.id===state.proxyCandidate)?.name||'')}</b></div>${note('可选择模拟成功或失败。模拟失败将保留原有效配置，不会悄悄改为直连。','warning')}</div>`,`<button class="btn btn-secondary" data-action="close-modal">取消</button><button class="btn btn-danger" data-action="proxy-apply-failure">模拟失败</button><button class="btn btn-primary" data-action="proxy-apply-success">模拟应用成功</button>`);
  if(m.type==='subscription')return modalFrame('订阅设置',`<form id="active-form" data-form="subscription" class="modal-body"><div class="field"><label>订阅 URL 或凭据</label><input class="control" name="subscription" type="password" placeholder="留空表示保留既有值"></div><div class="field"><label>更新后行为</label><select class="control" name="applyMode"><option value="preserve">失败保留旧配置</option></select></div>${note('此原型不保存、调用或展示真实代理订阅凭据。')}</form>`,footerSubmit('保存演示设置'));
  if(m.type==='forgot')return modalFrame('找回管理员密码',`<form id="active-form" data-form="forgot" class="modal-body"><p class="caption">验证码只会发送到已验证的本人恢复连接；不能在此临时输入任何其他收件人。</p><div class="field"><label>已绑定恢复通道</label><select name="connId" class="control">${connections.filter(c=>state.recoveryBound.includes(c.id)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>${state.otpSent?`<div class="notice warning">离线演示验证码：<b>246810</b>（正式系统不回显）。演示有效期 2 分钟，限 3 次。</div><div class="field"><label>验证码</label><input class="control" name="otp" autocomplete="one-time-code" placeholder="输入收到的验证码"></div><div class="field"><label>新管理密码</label><input class="control" name="newPassword" type="password" minlength="10" placeholder="至少 10 个字符"></div>`:note('如果无法使用任何已绑定通道，请走授权服务器终端重置流程，而非站内绕过验证。','warning')}</form>`,footerSubmit(state.otpSent?'验证并重置':'发送模拟验证码'));
  if(m.type==='bindRecovery')return modalFrame('绑定新的本人恢复通道',`<form id="active-form" data-form="bind-recovery" class="modal-body">${note('新增绑定必须先证明对新目标有控制权；旧绑定在验证成功前不能解除。')}<div class="field"><label>选择连接</label><select class="control" name="connId">${connections.filter(c=>c.active&&!state.recoveryBound.includes(c.id)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')||'<option value="">无可绑定连接</option>'}</select></div><div class="field"><label>当前管理员密码</label><input name="currentPassword" class="control" type="password" required></div></form>`,footerSubmit('模拟验证并绑定'));

 case 'logout':state.loggedIn=false;state.accountMenu=false;state.loginError='';render();return;
 case 'dismiss-toast':state.notice=null;render();return;
 case 'notice':toast('这是一条界面示例通知；没有调用任何真实机器人。');return;
 case 'toggle-scenario':state.demoScenario=state.demoScenario==='first'?'daily':'first';state.page='overview';render();return;
 case 'new-conversation':modal('newConversation');return;
 case 'conv-filter':state.convFilter=target.dataset.filter;state.mobileChat=false;render();return;
 case 'open-conversation':state.selectedConversation=id;state.page='conversations';state.mobileChat=true;state.modal=null;state.drawer=null;state.convFilter=convBy(id)?.archived?'archived':'all';render();return;
 case 'chat-back':state.mobileChat=false;render();return;
 case 'send-chat':sendChat(id);return;
 case 'task-answer':{
   const c=convBy(target.dataset.conv),m=c?.messages.find(x=>x.id===target.dataset.msg);if(!m?.task)return;
   if(m.task.answer){toast('任务已有有效决定，不允许覆盖。','warn');return}const idx=Number(target.dataset.choice);m.task.answer=m.task.options[idx];m.task.by='管理端';toast('任务决定已保存（模拟）。原程序是否领取和执行仍需单独确认。');return;
 }
 case 'simulate-other-answer':{
   const c=convBy(target.dataset.conv),m=c?.messages.find(x=>x.id===target.dataset.msg);if(!m?.task)return;
   if(!m.task.answer){m.task.answer=m.task.options[0];m.task.by='手机端'}toast('手机端已提交有效决定；管理端不能再重复覆盖。','warn');return;
 }
 case 'conversation-info':drawer('conversation',id);return;
 case 'message-detail':state.drawer={type:'message',convId:target.dataset.conv,msgId:target.dataset.msg};render();return;
 case 'claim-message':{const msg=convBy(target.dataset.conv)?.messages.find(m=>m.id===target.dataset.msg);if(msg){msg.state='已领取';toast('客户端已确认领取（模拟），仍不代表业务已执行。')}return}

 case 'rename-conversation':modal('renameConversation',{convId:id});return;
 case 'pin-conversation':{const c=convBy(id);if(c){c.pinned=!c.pinned;toast(c.pinned?'会话已模拟置顶。':'已取消置顶。')}return}
 case 'confirm-delete':modal('confirmDelete',{convId:id});return;
 case 'archive-conversation':{const c=convBy(id);if(c)c.archived=true;state.modal=null;state.drawer=null;state.convFilter='archived';toast('会话已模拟归档，历史仍可查看。');return}
 case 'unarchive-conversation':{const c=convBy(id);if(c)c.archived=false;state.drawer=null;state.convFilter='all';toast('已恢复该模拟会话。');return}
 case 'delete-conversation':{const i=conversations.findIndex(x=>x.id===id);if(i>=0)conversations.splice(i,1);state.modal=null;state.drawer=null;state.selectedConversation=conversations[0]?.id||null;state.mobileChat=false;toast('已在当前原型会话数据中模拟删除。','warn');return}
 case 'jump-message':state.highlightMessage=target.dataset.msg;state.selectedConversation=target.dataset.conv;state.page='conversations';state.convFilter=convBy(state.selectedConversation)?.archived?'archived':'all';state.drawer=null;state.mobileChat=true;render();return;
 case 'delivery-detail':drawer('delivery',id);return;
 case 'delivery-filter':state.deliveryStatus=target.dataset.status;state.page='deliveries';render();return;
 case 'reset-delivery':state.deliveryStatus='all';state.deliveryApp='all';state.deliveryConnection='all';state.deliveryQuery='';render();return;
 case 'copy-diagnostic':{const d=deliveries.find(x=>x.id===id);if(d)copyText(`记录 ${d.id} | ${d.title} | ${d.status} | ${d.time} | ${d.detail}`);return}
 case 'show-app-deliveries':state.deliveryApp=id;state.deliveryStatus='all';state.deliveryConnection='all';state.page='deliveries';state.selectedAppId=null;render();return;
 case 'open-app':state.selectedAppId=id;render();return;
 case 'close-app':state.selectedAppId=null;render();return;
 case 'new-app':modal('newApp');return;
 case 'edit-app':modal('editApp',{appId:id});return;
 case 'integrate-app':modal('integrate',{appId:id,choice:target.dataset.choice||'codex'});return;
 case 'integration-kind':state.modal.choice=target.dataset.kind;render();return;
 case 'download-doc':downloadDemo(id,target.dataset.kind);return;
 case 'rotate-key':modal('rotateKey',{appId:id});return;
 case 'revoke-key':modal('revokeKey',{appId:id});return;
 case 'revoke-old':{const a=appBy(id);if(a)a.oldKey=null;toast('已完成旧演示凭据过渡撤销。');return}
 case 'copy-issued':{const field=document.getElementById('issued-token');if(field)copyText(field.value);return}
 case 'copy':copyText(target.dataset.copy||'');return;
 case 'new-connection':modal('newConnection');return;
 case 'connection-detail':drawer('connection',id);return;
 case 'connection-impact':drawer('impact',id);return;
 case 'test-connection-send':{const c=connBy(id);if(c){c.sendTest=true;c.configured=true;c.sendAt='刚刚 · 模拟';toast('模拟发送验证成功；并未向真实平台发送消息。')}return}
 case 'test-connection-reply':{const c=connBy(id);if(c){c.replyTest=true;c.receiveAt='刚刚 · 模拟';toast('模拟回复接收验证成功。')}return}
 case 'test-connection-failure':{const c=connBy(id);if(c){c.sendTest=false;c.sendAt='本次模拟失败';toast('模拟检测失败；配置与原有授权已保留。','warn')}return}
 case 'toggle-connection':{const c=connBy(id);if(!c)return;if(c.active&&state.recoveryBound.includes(id)&&state.recoveryBound.length<=1){toast('最后一个管理员恢复通道受保护，必须先验证新的绑定。','warn');return}c.active=!c.active;toast(c.active?'连接已模拟启用。':'连接已模拟停用；受影响应用请检查。','warn');return}
 case 'delete-connection':{const c=connBy(id);if(!c)return;if(state.recoveryBound.includes(id)){toast('该连接绑定管理员恢复身份，须先换绑并验证。','warn');return}if(apps.some(a=>a.allowed.includes(id))){toast('仍有应用依赖该连接，请先完成影响迁移。','warn');return}connections=connections.filter(x=>x.id!==id);state.drawer=null;toast('未被引用的连接已在模拟数据中删除。');return}
 case 'settings-tab':state.settingsTab=tab;render();return;
 case 'node-select':state.proxyCandidate=id;render();return;
 case 'node-test':state.nodeCheck[id]='通过（模拟）';toast('节点检测示例已完成；未执行真实网络请求。');return;
 case 'simulate-node-refresh':toast('模拟订阅已刷新：共 '+nodes.length+' 个节点，旧配置保持有效。');return;
 case 'proxy-cancel':state.proxyCandidate=state.proxyApplied;toast('候选变更已撤销，原出口未改变。');return;
 case 'proxy-apply':if(state.proxyCandidate!==state.proxyApplied)modal('applyProxy');return;
 case 'proxy-apply-success':state.proxyApplied=state.proxyCandidate;state.modal=null;toast('节点切换模拟成功；当前出口展示已更新。');return;
 case 'proxy-apply-failure':state.proxyCandidate=state.proxyApplied;state.modal=null;toast('模拟切换失败，已保留原生效出口。','warn');return;
 case 'subscription-edit':modal('subscription');return;
 case 'help-detail':state.drawer={type:'help',role:target.dataset.role};render();return;
 case 'forgot-password':state.otpSent=false;modal('forgot');return;
 case 'bind-recovery':modal('bindRecovery');return;
 case 'recovery-guide':drawer('recovery-guide','');return;
 case 'remove-recovery':modal('removeRecovery',{connId:id});return;
 case 'close-modal':closeModal();return;
 case 'overlay-close':if(event.target===target){closeModal()}return;
 case 'close-drawer':if(event.target===target||target.tagName==='BUTTON'){state.drawer=null;render()}return;
 default:return;
 }
}
function render(){const root=document.getElementById('app');if(!root)return;const pages={overview:renderOverview,conversations:renderConversations,deliveries:renderDeliveries,apps:renderApps,connections:renderConnections,settings:renderSettings,help:renderHelp,account:renderAccount};root.innerHTML=state.loggedIn?shell((pages[state.page]||renderOverview)()):renderLogin();if(state.scrollChatBottom){state.scrollChatBottom=false;requestAnimationFrame(()=>{let b=root.querySelector('[data-scroll-target="conv-body"]');if(b)b.scrollTop=b.scrollHeight})}if(state.highlightMessage){const id=state.highlightMessage;state.highlightMessage=null;requestAnimationFrame(()=>{const x=document.getElementById('msg-'+id);if(x){x.scrollIntoView({block:'center'});x.style.outline='2px solid #7e9bed';x.style.outlineOffset='5px';x.style.borderRadius='10px'}})}}
function updateSearch(field,value){if(field==='conv')state.convQuery=value;if(field==='delivery')state.deliveryQuery=value;if(field==='app')state.appQuery=value;const active=document.activeElement,position=active.selectionStart;render();const el=document.querySelector(`[data-search="${field}"]`);if(el){el.focus();if(position!=null)el.setSelectionRange(position,position)}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');const onBackdrop=t&&((t.dataset.action==='overlay-close'&&e.target!==t)||(t.dataset.action==='close-drawer'&&e.target!==t&&t.tagName!=='BUTTON'));if(t&&!onBackdrop){e.preventDefault();processAction(t,e)}else if(state.accountMenu&&!e.target.closest('.dropdown')){state.accountMenu=false;render()}});
document.addEventListener('submit',e=>{if(e.target.matches('[data-form]')){e.preventDefault();handleForm(e.target)}});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-draft]'))state.drafts[t.dataset.draft]=t.value;if(t.matches('[data-search]'))updateSearch(t.dataset.search,t.value)});
document.addEventListener('change',e=>{const t=e.target;if(!t.matches('[data-change]'))return;const field=t.dataset.change;switch(field){case 'delivery-status':state.deliveryStatus=t.value;break;case 'delivery-app':state.deliveryApp=t.value;break;case 'delivery-connection':state.deliveryConnection=t.value;break;case 'proxy-mode':state.proxyMode=t.value;break;}render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal){state.modal=null;render();return}if(state.drawer){state.drawer=null;render();return}if(state.accountMenu){state.accountMenu=false;render()}}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&e.target.matches('[data-draft]')){e.preventDefault();sendChat(e.target.dataset.draft)}});
render();

</script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <noscript>请启用 JavaScript 以体验本地交互原型。</noscript>
</body>
