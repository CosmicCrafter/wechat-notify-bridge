services:
  wechat-notifier:
    build: .
    restart: unless-stopped
    ports:
      - "${WECHAT_BIND:-127.0.0.1}:${WECHAT_PORT:-18092}:8092"
    environment:
      WECHAT_PUBLIC_BASE_URL: "${WECHAT_PUBLIC_BASE_URL:-}"
    volumes:
      - ./.data:/data
      - ./.private/provisioned/secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.5
