# Add this location inside your EXISTING HTTPS server block.
# Configure your own domain and TLS certificate in that server block.
location = /bridge {
    return 308 /bridge/;
}
location ^~ /bridge/ {
    proxy_pass http://127.0.0.1:18092/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 120s;
    client_max_body_size 6m;
    access_log off;
}
# Legacy alias: do not remove while clients and callbacks use it.
location = /wechat {
    return 308 /wechat/;
}
location ^~ /wechat/ {
    proxy_pass http://127.0.0.1:18092/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # Transport allowance; the application enforces 5 MiB per image.
    client_max_body_size 6m;
    access_log off;
}
# RFC 8414 / 9728 discovery for this path-prefixed MCP only.
location = /.well-known/oauth-authorization-server/wechat {
    proxy_pass http://127.0.0.1:18092;
    proxy_set_header Host $host;
    access_log off;
}
location = /.well-known/oauth-protected-resource/wechat/mcp {
    proxy_pass http://127.0.0.1:18092;
    proxy_set_header Host $host;
    access_log off;
}

# For fresh deployments using /bridge as OAuth issuer.
location = /.well-known/oauth-authorization-server/bridge {
    proxy_pass http://127.0.0.1:18092;
    proxy_set_header Host $host;
    access_log off;
}
location = /.well-known/oauth-protected-resource/bridge/mcp {
    proxy_pass http://127.0.0.1:18092;
    proxy_set_header Host $host;
    access_log off;
}
